{% load static %}
<!DOCTYPE html>
<html>

<head>
  {% load static %}
  <title>Potluck | Log-in</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log-in to your Potluck account" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" href="{%static 'images/pot.ico' %}" />
  <link rel="stylesheet" href="{%static 'css/bootstrap-utilities.css' %}" />
  <link rel="stylesheet" href="{%static 'css/bootstrap.css' %}" />
  <link rel="stylesheet" href="{%static 'css/signin.css' %}" />
  <link rel="stylesheet" href="{%static 'css/potluck.css' %}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
  <script src="{%static 'js/bootstrap.bundle.min.js' %}" defer></script>
  <script src="{%static 'js/potluck.js' %}" defer></script>
  <script src="{% static 'js/passwdToggle.js' %}" defer></script>

  <!-- Password Visibility Icon Stuff DO NOT TOUCH OR MAYAH WILL CRY -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">

</head>


<body>
  <div class="wrapper">
    {% include 'partials/nav.html' %}

    <div class="d-flex mt-4 align-items-center py-4">
      <main class="form-signin w-100 m-auto">
        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          {% if error %}
          <div class="alert alert-danger" role="alert">
            {{ error }}
          </div>
          {% endif %}

          <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

          <div class="form-floating">
            <input type="text" name="email" class="form-control" id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Email</label>
          </div>
          <div class="form-floating position relative">
            <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Password</label>
            <!-- Visibility Icon -->
            <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3" id="togglePassword"
              style="z-index: 10; cursor: pointer;"></i>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault"
                style="cursor: pointer;">
              <label class="form-check-label" for="flexCheckDefault">
                Remember me
              </label>
            </div>
            <div>
              <a href="{% url 'forgot_pw' %}" class="forgot-link">Forgot Password?</a>
            </div>
          </div>

          <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
          <div class="divider-container">
            <div class="line"></div>
            <span class="or-text">or</span>
            <div class="line"></div>
          </div>

          <p class="signup-prompt mt-3">
            Don't have an account? <a href="{% url 'sign_up' %}" class="signup-link">Sign Up</a>
          </p>

        </form>
      </main>
    </div>

    {% include 'partials/footer.html' %}
  </div>
</body>

</html>
