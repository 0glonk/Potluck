<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">

<head>
  {% load static %}
  <title>Potluck | page-name</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" href="{%static 'images/pot.ico' %}" />
  <link rel="stylesheet" href="{%static 'css/bootstrap-utilities.css' %}" />
  <link rel="stylesheet" href="{%static 'css/bootstrap.css' %}" />
  <link rel="stylesheet" href="{%static 'css/potluck.css' %}" />
  <link rel="stylesheet" href="{%static 'css/home.css' %}" />
  <script src="{%static 'js/bootstrap.bundle.min.js' %}" defer></script>
  <script src="{%static 'js/potluck.js' %}" defer></script>
  <style>
    :root {
      --red-orange: #FF5C4D;
      --orange: #FF9636;
      --yellow: #FFCD58;
      --green: #DAD870;
    }

    body {
      height: 100vh;
    }

    body,
    .album {
      background-image: linear-gradient(to bottom right, var(--green), #e1e08d);

    }

    .swiper {
      width: 90%;
      max-width: 1200px;
      --swiper-pagination-color: var(--orange);
      --swiper-pagination-bottom: 0px;
      --swiper-navigation-color: var(--orange);

      .swiper-slide {
        margin: 3.75em 0;
        background-size: cover;
        width: 250px;
        height: 250px;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        border-radius: 10%;
      }

      .swiper-slide span {
        z-index: 100;
        position: absolute;
        bottom: 8%;
        left: 0%;
        background-color: var(--orange);
        width: 250px;
        height: 40px;
        text-align: center;
        line-height: 40px;
        font-size: 1em;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.4);
      }

      .swiper-slide a {
        color: white;
      }
    }

    nav {
      background-image: linear-gradient(to bottom right, var(--red-orange), var(--orange));
      font-size: 1.25em;
    }

    #navLogo {
      max-width: 130px;
      min-width: 80px;
      height: auto;
      width: 15vw;
    }

    .navbar-toggler:focus {
      box-shadow: 0 0 0 0.1rem;
    }

    .nav-item {
      padding: 0 1em;
    }

    .nav-item:hover {
      background-color: var(--yellow);
      border-radius: 15px;
    }

    .dropdown-menu {
      background-color: rgb(231, 231, 231);

      :hover {
        background-color: var(--green);
      }
    }

    .content-container {
      max-width: 60%;
      margin: 0 auto;
      padding: 2em 1em;
      text-align: left;
    }

    .section-block {
      margin-bottom: 2em;
    }

    .upgrade-block {
      text-align: center;
    }

    #upgrade-button {
      padding: 0.75em 1.5em;
      font-size: 1em;
      cursor: pointer;
    }

    @media screen and (max-width: 991px) {
      .dropdown:has(.show) {
        padding-bottom: 15px;
      }
    }

    .searchContainer {
      justify-content: center;
      margin: 1em auto;
      width: 90%;
    }

    .searchContainer form {
      justify-content: center;
    }

    #searchHome {
      max-width: 900px;
      width: 50%;
    }

    #filter {
      max-width: 150px;
      margin-left: 1em;
    }

    .bd-placeholder-img {
      font-size: 1.125rem;
      text-anchor: middle;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    .card {
      max-width: 275px;
      margin: 0 auto;
    }

    .card-body {
      background-image: linear-gradient(to bottom, var(--red-orange), var(--orange));
      color: white;
    }

    .btn-outline-secondary,
    .btn-outline-secondary:hover,
    .btn-outline-secondary:active,
    .btn-outline-secondary:visited,
    .btn-outline-secondary:focus,
    .btn-outline-secondary:active:focus {
      background-color: var(--yellow);
      border-color: black;
      color: black;
    }

    #upgrade-button {
      background-color: #FF9636;
      border-radius: 1em;
      padding: 0.8em;
      margin: 1em;
      width: 14em;
    }

    #promo {
      margin-top: 5em;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    {% include 'partials/nav.html' %}
    <main>

      <div class="content-container">
        <div class="section-block">
          <!-- back-end integration for profile username goes here -->
          <h1>Username</h1>
        </div>

        <div class="section-block">
          <h2>Member since</h2>
          <p>XX/XX/XXXX</p>
        </div>

        <div class="section-block">
          <h2>Next Billing Cycle</h2>
          <p>XX/XX/XXXX</p>
        </div>

        <div class="upgrade-block" class="center">
          <!-- third party payment system integration goes here -->
          <button id="upgrade-button">Edit Payment Method</button>
        </div>
        <div class="upgrade-block" class="center">
          <button id="upgrade-button">Cancel Premium</button>
        </div>
      </div>
      {% include 'partials/footer.html' %}
  </div>
  </main>
</body>

</html>
