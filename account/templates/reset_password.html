{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Potluck | Reset Password</title>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="{% static 'images/pot.ico' %}" />
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
    <link rel="stylesheet" href="{% static 'css/potluck.css' %}" />
    <link rel="stylesheet" href="{% static 'css/signUp.css' %}" />

    <!-- Password Visibility Icon Stuff -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="wrapper">
        {% include 'partials/nav.html' %}
        <div class="signup-wrapper">
            <div class="signup-container">
                <main class="form-signin w-100 m-auto">
                    <h1 class="h3 mb-3 fw-normal">Reset your password</h1>
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-floating mb-3 position-relative">
                            <input type="password" id="newPassword" name="new_password" class="form-control"
                                placeholder="New Password" required>
                            <label for="newPassword">New Password</label>
                            <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3"
                                id="toggleNewPassword" style="z-index: 10; cursor: pointer;"></i>
                        </div>
                        <div class="form-floating mb-3 position-relative">
                            <input type="password" id="confirmPassword" name="confirm_password" class="form-control"
                                placeholder="Confirm Password" required>
                            <label for="confirmPassword">Confirm Password</label>
                            <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3"
                                id="toggleConfirmPassword" style="z-index: 10; cursor: pointer;"></i>
                        </div>
                        <button class="btn btn-primary w-100 py-2" type="submit">Reset Password</button>
                    </form>
                </main>
            </div>
        </div>
        {% include 'partials/footer.html' %}

    </div>
    <!-- Visibility Icon Script DO NOT TOUCH!!!-->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function toggleVisibility(toggleID, inputID) {
                const toggleIcon = document.getElementById(toggleID);
                const passwordInput = document.getElementById(inputID);

                toggleIcon.addEventListener('click', function () {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    toggleIcon.classList.toggle('bi-eye');
                    toggleIcon.classList.toggle('bi-eye-slash');
                });
            }
            toggleVisibility('toggleNewPassword', 'newPassword');
            toggleVisibility('toggleConfirmPassword', 'confirmPassword');
        });
    </script>
</body>

</html>
