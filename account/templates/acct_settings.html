<!DOCTYPE html>
<html lang="en">

<head>
  {% load static %}
  <title>Potluck | About</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords"
    content="cooking, recipe, sharing, food, cook, home cook, chef, restaurant, shopping, social media" />
  <meta name="description" content="Share and discover new recipes with Potluck" />
  <link rel="icon" href="" />
  <link rel="stylesheet" href="{%static 'css/bootstrap-utilities.css' %}" />
  <link rel="stylesheet" href="{%static 'css/bootstrap.css' %}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="{%static 'js/bootstrap.bundle.min.js' %}" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
  <script src="{%static 'js/swiper.js' %}" defer></script>
  <style>
    :root {
      --red-orange: #FF5C4D;
      --orange: #FF9636;
      --yellow: #FFCD58;
      --green: #DAD870;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f4;
    }

    body,
    .album {
      background-image: linear-gradient(to bottom right, var(--green), #e1e08d);
    }

    .small-page {
      position: relative;
      width: 80%;
      max-width: 500px;
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .header {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .content {
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .cta {
      text-align: center;
    }

    .cta button {
      background-color: var(--orange);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    .cta button:hover {
      background-color: var(--yellow);
    }

    .settings_button {
      background-color: #FF9636;
      border-radius: 1em;
      padding: 0.8em;
      margin: 1em;
      width: 11em;
    }

    .buttons {
      text-align: center;
    }

    #close_button {
      margin-top: 5em;
    }
  </style>
</head>

<body>
  <div class="small-page">

    <div class="content">

      <div class="content">
        <div class="buttons">
          <button class="settings_button">Hide Account</button>
        </div>

        <div class="buttons">
          <button class="settings_button">Delete Account</button>
        </div>

        <div class="buttons">
          <button class="settings_button">Premium</button>
        </div>

        <div class="buttons">
          <button id="close_button" class="settings_button">Cancel</button>
        </div>
      </div>
    </div>
</body>

</html>
